{% extends "base.html" %}
{% block content %}
<h1>{{ t('lookup_title') }}</h1>
<p>{{ t('lookup_intro') }}</p>
{% if errors %}
<div class="errors" role="alert">{% for e in errors %}<p>{{ t(e) }}</p>{% endfor %}</div>
{% endif %}
<form method="post" action="/p">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="lang" value="{{ lang }}">
<label for="phone">{{ t('phone') }}</label>
<input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="24" value="{{ phone }}" required>
<button type="submit">{{ t('lookup_submit') }}</button>
</form>
{% endblock %}
