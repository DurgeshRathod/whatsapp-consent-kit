[project]
name = "whatsapp-consent-kit"
version = "0.1.0"
description = "WhatsApp consent for FastAPI + SQLAlchemy + Postgres apps: collect, verify, check, honour opt-outs, erase."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "segno>=1.6",
]

[project.scripts]
whatsapp-consent = "whatsapp_consent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "pyright>=1.1.380"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.uv.build-backend]
module-name = "whatsapp_consent"
